<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <title>API 보안 AI</title>

    <link rel="stylesheet" href="/static/style.css">

</head>

<body>

<div class="container">

    <h1>🛡 API 보안 AI 시스템</h1>

    <p>
        CSV 파일을 업로드하면
        AI가 악성 여부를 분석합니다.
    </p>

    <form
        action="/predict"
        method="POST"
        enctype="multipart/form-data"
    >

        <input type="file" name="file" required>

        <button type="submit">
            AI 분석 시작
        </button>

    </form>

    {% if malicious is defined %}

    <div class="result">

        <h2>📊 분석 결과</h2>

        <p class="bad">
            악성 API 수 : {{ malicious }}
        </p>

        <p class="good">
            정상 API 수 : {{ normal }}
        </p>

    </div>

    {% endif %}

    {% if table %}

    <div class="table-container">

        {{ table|safe }}

    </div>

    {% endif %}

</div>

</body>

</html>
